name: Publish

on:
  push:
    tags: ['mcp-v*']
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  # Required to mint the OIDC token the trusted publisher authenticates with.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Trusted publishing needs npm 11.5.1+; the Node 22 image ships npm 10.
      - name: Use an npm that supports trusted publishing
        run: npm install -g npm@latest

      - name: Publish to npm
        run: npm publish
